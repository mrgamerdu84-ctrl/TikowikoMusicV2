name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify original ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find source -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$ZIP"
          echo "dee5c99a7340bd891451d3a2c1436358e56ee5fc73013134fb317afd6e185ea6  $ZIP" | sha256sum -c -

      - name: Prepare player-only web app
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find source -maxdepth 1 -type f -name '*.zip' -print -quit)
          rm -rf app/src/main/assets/www app/src/main/res/drawable
          mkdir -p app/src/main/assets/www app/src/main/res/drawable
          unzip -q "$ZIP" -d app/src/main/assets/www
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/icon.jpg
          test -f app/src/main/assets/www/splash.jpg
          cp web/app.js app/src/main/assets/www/app.js
          cp web/player-only.css app/src/main/assets/www/player-only.css
          cp web/enhancements.js app/src/main/assets/www/enhancements.js
          cp web/enhancements.css app/src/main/assets/www/enhancements.css
          cp web/parallel-media.js app/src/main/assets/www/parallel-media.js
          cp web/library-playlists.js app/src/main/assets/www/library-playlists.js
          cp web/library-playlists.css app/src/main/assets/www/library-playlists.css
          cp web/folder-strict.js app/src/main/assets/www/folder-strict.js
          cp web/tikobot.js app/src/main/assets/www/tikobot.js
          cp web/tikobot.css app/src/main/assets/www/tikobot.css
          cp web/tikobot-visual.js app/src/main/assets/www/tikobot-visual.js
          cp web/tikobot-greeting.js app/src/main/assets/www/tikobot-greeting.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          links = [
              '<link rel="stylesheet" href="player-only.css" />',
              '<link rel="stylesheet" href="enhancements.css" />',
              '<link rel="stylesheet" href="library-playlists.css" />',
              '<link rel="stylesheet" href="tikobot.css" />',
          ]
          for link in links:
              if link not in s:
                  s = s.replace('</head>', link + '\n</head>')
          scripts = [
              '<script src="enhancements.js"></script>',
              '<script src="parallel-media.js"></script>',
              '<script src="library-playlists.js"></script>',
              '<script src="folder-strict.js"></script>',
              '<script src="tikobot.js"></script>',
              '<script src="tikobot-visual.js"></script>',
              '<script src="tikobot-greeting.js"></script>',
          ]
          for script in scripts:
              if script not in s:
                  s = s.replace('</body>', script + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
          cp app/src/main/assets/www/icon.jpg app/src/main/res/drawable/icon.jpg
          cp app/src/main/assets/www/splash.jpg app/src/main/res/drawable/splash.jpg
          cp android-res/splash_screen.xml app/src/main/res/drawable/splash_screen.xml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TikowikoMusicV2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikowikoMusicV2-apk
          path: TikowikoMusicV2.apk
          if-no-files-found: error
          retention-days: 30
